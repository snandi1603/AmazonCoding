function loadState() {
  try { const s = localStorage.getItem(STORAGE_KEY); return s ? JSON.parse(s) : {}; }

}
function saveState(s) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); } catch {}

  505:{desc:"Given m×n grid of 0s/1s, find submatrix with maximum number of 1s.",hint:"2D prefix sums. For each row pair, reduce to 1D max subarray (Kadane's)."},
  506:{desc:"Given server loads updated in real time, after each update return index of server with minimum load.",hint:"Maintain loads array. Linear scan O(n) or sorted structure for O(log n)."},
  507:{desc:"Given processes with arrival/burst/priority, simulate priority-based scheduler. Return completion order.",hint:"Min-heap keyed on (priority, arrival, id). At each tick, add arrived processes, pop highest priority."},
  508:{desc:"Given integer array, return minimum increments so every subarray of length>1 has non-negative sum.",hint:"Greedy: running prefix sum. When sum<0: increments+=abs(sum), reset sum=0. O(n)."},
  509:{desc:"Split n servers into k near-equal groups to minimize total variance (max_level-min_level) per group.",hint:"Sort by security level. Contiguous grouping is optimal. First (n%k) groups get ceil(n/k) servers."},
  510:{desc:"Given n server bandwidths and k cables, pair servers to maximize total bandwidth of k pairs.",hint:"Sort descending. Sum first 2k elements (adjacent pairs). Greedy is optimal."},
};

        {totalBatches > 1 && (
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",background:"#1a1d27",borderRadius:"10px",padding:"10px 14px",marginBottom:"12px",border:"1px solid #1e2235"}}>
            <span style={{fontSize:"0.8rem",color:"#888"}}>Questions {activeBatch*PER_BATCH+1}–{Math.min((activeBatch+1)*PER_BATCH,currentDSA.length)} of {currentDSA.length}</span>
            <div style={{display:"flex",gap:"6px"}}>
              <button style={{...S.btn("#636EFA","#1e2030","#636EFA"),opacity:activeBatch===0?0.3:1}} onClick={()=>activeBatch>0&&setActiveBatch(b=>b-1)}>← Prev</button>
              <button style={{...S.btn("#00b8a3","#003d37","#00b8a3"),opacity:activeBatch>=totalBatches-1?0.3:1}} onClick={()=>activeBatch<totalBatches-1&&setActiveBatch(b=>b+1)}>Next →</button>
            </div>
          </div>
        )}

        {currentDSA.length === 0 && (
          <div style={{textAlign:"center",padding:"40px",color:"#555"}}>No DS&A questions assigned to Day {activeDay}. Pick another day from the buttons above.</div>
        )}

        {dsaBatch.map((q,idx) => {
          const [rank,lcNum,title,acceptance,difficulty,category,isOA] = q;
          const qId = rank;
          const status = answered[qId];
          const hinted = expandedHints[qId];
          const problemShown = expandedProblems[qId];
          const catColor = CAT_COLORS[category] || "#888";
          const slug = title.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
          const lcUrl = `https://leetcode.com/problems/${slug}/`;
          const oaData = OA_PROBLEMS[rank];

          return (
            <div key={rank} style={S.card(status)}>
              <div style={{display:"flex",alignItems:"center",gap:"6px",marginBottom:"10px",flexWrap:"wrap"}}>
                <span style={S.badge("#252836","#666")}>#{rank}</span>
                {isOA ? <span style={S.badge("#FF97FF22","#FF97FF")}>🏢 OA</span>
                      : <span style={S.badge("#636EFA22","#636EFA")}>LC {lcNum}</span>}
                <span style={S.badge(DIFF_BG[difficulty],DIFF_COLOR[difficulty])}>{difficulty}</span>
                <span style={S.badge(catColor+"22",catColor)}>{category}</span>
                {status && <span style={{marginLeft:"auto"}}>{status==="solved"?"✅":status==="unsolved"?"❌":"⏭️"}</span>}
              </div>
              <div style={{fontSize:"0.97rem",fontWeight:700,color:"#fff",marginBottom:"8px"}}>{activeBatch*PER_BATCH+idx+1}. {title}</div>
              <div style={{fontSize:"0.73rem",color:"#666",marginBottom:"10px"}}>Acceptance: {acceptance}</div>
              <div style={{display:"flex",gap:"6px",flexWrap:"wrap"}}>
                <button style={{...S.btn("#00b8a3",status==="solved"?"#004a38":"#003d37","#00b8a3")}} onClick={()=>mark(qId,"solved")}>✅ Solved</button>
                <button style={{...S.btn("#ff375f",status==="unsolved"?"#4a0010":"#3d0010","#ff375f")}} onClick={()=>mark(qId,"unsolved")}>❌ Review</button>
                <button style={{...S.btn("#ffc01e",status==="skip"?"#4a3a00":"#3d3200","#ffc01e")}} onClick={()=>mark(qId,"skip")}>⏭️ Skip</button>
                <button style={S.btn("#636EFA","#1e2030","#636EFA")} onClick={()=>toggleHint(qId)}>{hinted?"🙈 Hint":"💡 Hint"}</button>
                {isOA
                  ? <button style={S.btn("#AB63FA","#1e2030","#AB63FA")} onClick={()=>toggleProblem(qId)}>{problemShown?"📕":"📖 Problem"}</button>
                  : <a href={lcUrl} target="_blank" rel="noreferrer" style={{...S.btn("#FFA15A","#1e2030","#FFA15A"),textDecoration:"none"}}>🔗 LC</a>}
              </div>
              {problemShown && oaData && (
                <div style={{marginTop:"10px",background:"#1a1535",borderRadius:"8px",padding:"12px",borderLeft:"3px solid #AB63FA",fontSize:"0.8rem",color:"#ccc",lineHeight:1.6}}>
                  <strong style={{color:"#AB63FA"}}>📖 </strong>{oaData.desc}
                </div>
              )}
              {hinted && (
                <div style={{marginTop:"10px",background:"#1e2035",borderRadius:"8px",padding:"10px 12px",borderLeft:"3px solid #636EFA",fontSize:"0.8rem",color:"#ccc",lineHeight:1.6}}>
                  <strong style={{color:"#636EFA"}}>💡 </strong>{isOA&&oaData?oaData.hint:(DSA_HINTS[lcNum]||"Check LeetCode editorial.")}
                </div>
              )}
            </div>
          );
        })}
      </div>
    );
  };

  // ── CLASSES VIEW ──────────────────────────────────────────────────────────
  const ClassesView = () => {
    const dayData = STUDY_PLAN[activeDay-1];
    return (
      <div style={{padding:"16px 20px"}}>
        <div style={{display:"flex",alignItems:"center",gap:"10px",marginBottom:"14px",flexWrap:"wrap"}}>
          <div>
            <div style={{fontSize:"1rem",fontWeight:700,color:"#fff"}}>⚙️ Classes &amp; Modularization — Day {activeDay}</div>
            <div style={{fontSize:"0.78rem",color:"#888"}}>{currentClasses.length} problems · Paste solutions to Claude for review</div>
          </div>
          <div style={{display:"flex",gap:"4px",flexWrap:"wrap",marginLeft:"auto"}}>
            {STUDY_PLAN.filter(d=>d.classes.length>0).map(d=>(
              <button key={d.day} onClick={()=>{setActiveDay(d.day);setActiveBatch(0);}} style={{padding:"4px 8px",borderRadius:"6px",border:`1px solid ${activeDay===d.day?"#54A24B":"#2a2d3a"}`,background:activeDay===d.day?"#54A24B22":"transparent",color:activeDay===d.day?"#54A24B":"#666",fontSize:"0.72rem",fontWeight:700,cursor:"pointer"}}>D{d.day}</button>
            ))}
          </div>
        </div>

        <div style={{background:"#1a1d27",borderRadius:"10px",padding:"12px 14px",marginBottom:"14px",border:"1px solid #1e2235",fontSize:"0.8rem",color:"#aaa",lineHeight:1.6}}>
          <strong style={{color:"#54A24B"}}>🎯 Amazon grades: </strong>Clear class boundaries · Single-responsibility methods · Encapsulated state · Domain-matching names · O(1) where possible
        </div>

        {currentClasses.length === 0 && (
          <div style={{textAlign:"center",padding:"40px",color:"#555"}}>No Classes problems for Day {activeDay}. Select a day with Classes problems (D1–D5).</div>
        )}

        {currentClasses.map(p => {
          const status = answered[p.id];
          const hinted = expandedHints[p.id];
          return (
            <div key={p.id} style={S.card(status)}>
              <div style={{display:"flex",alignItems:"center",gap:"6px",marginBottom:"10px",flexWrap:"wrap"}}>
                <span style={S.badge("#252836","#666")}>{p.id}</span>
                <span style={S.badge("#54A24B22","#54A24B")}>⚙️ Classes</span>
                <span style={S.badge(DIFF_BG[p.difficulty],DIFF_COLOR[p.difficulty])}>{p.difficulty}</span>
                <span style={S.badge("#19D3F322","#19D3F3")}>{p.focus}</span>
                <span style={{fontSize:"0.68rem",color:"#555",marginLeft:"auto"}}>{p.source}</span>
                {status && <span>{status==="solved"?"✅":status==="unsolved"?"❌":"⏭️"}</span>}
              </div>
              <div style={{fontSize:"0.97rem",fontWeight:700,color:"#fff",marginBottom:"10px"}}>{p.title}</div>
              <div style={{fontSize:"0.78rem",color:"#888",marginBottom:"10px"}}>📋 Open classes_quiz.html for the full problem statement and examples.</div>
              <div style={{display:"flex",gap:"6px",flexWrap:"wrap"}}>
                <button style={{...S.btn("#00b8a3",status==="solved"?"#004a38":"#003d37","#00b8a3")}} onClick={()=>mark(p.id,"solved")}>✅ Solved</button>
                <button style={{...S.btn("#ff375f",status==="unsolved"?"#4a0010":"#3d0010","#ff375f")}} onClick={()=>mark(p.id,"unsolved")}>❌ Review</button>
                <button style={{...S.btn("#ffc01e",status==="skip"?"#4a3a00":"#3d3200","#ffc01e")}} onClick={()=>mark(p.id,"skip")}>⏭️ Skip</button>
                <button style={S.btn("#54A24B","#1e2a1e","#54A24B")} onClick={()=>toggleHint(p.id)}>{hinted?"🙈 Hide":"💡 Hint"}</button>
              </div>
              {hinted && (
                <div style={{marginTop:"10px",background:"#1e2a1e",borderRadius:"8px",padding:"10px 12px",borderLeft:"3px solid #54A24B",fontSize:"0.8rem",color:"#ccc",lineHeight:1.6}}>
                  <strong style={{color:"#54A24B"}}>💡 Pattern: </strong>
                  {{ C1:"Team + League classes. Cache best team in addMatch. findFirst() is O(1) — never scan.",
                     C2:"Task dataclass + Scheduler class with heapq. tick() reduces remaining, pop on completion.",
                     C3:"DeliveryPoint + Zone (owns centroid calc) + DeliveryNetwork coordinator.",
                     C4:"Log dataclass + WarehouseAllocator. bisect.insort for sorted parts. canFulfillOrder checks len().",
                     C5:"Server dataclass + per-type min-heap. _get_heap(type) helper. Compute cost before dealloc.",
                     C6:"Sort by security level. Optimal contiguous grouping. _partition_into_k() as separate method.",
                     C7:"DiscountRule dataclass. PricingEngine.applyRules() pipelines rules sequentially.",
                     C8:"CacheStore (LRU) + AccessTracker (stats) as separate classes. AnalyticsLRUCache composes both.",
                     C9:"Order dataclass + OrderStateMachine (transitions dict) + OrderSystem coordinator.",
                     C10:"Product dataclass with needs_reorder property. _check_reorder() private helper after sell().",
                  }[p.id] || "Design with clear class boundaries and single-responsibility methods."}
                </div>
              )}
            </div>
          );
        })}
      </div>
    );
  };

  // ── LOGICAL VIEW ──────────────────────────────────────────────────────────
  const LogicalView = () => {
    return (
      <div style={{padding:"16px 20px"}}>
        <div style={{display:"flex",alignItems:"center",gap:"10px",marginBottom:"14px",flexWrap:"wrap"}}>
          <div>
            <div style={{fontSize:"1rem",fontWeight:700,color:"#fff"}}>🧹 Logical &amp; Maintainable — Day {activeDay}</div>
            <div style={{fontSize:"0.78rem",color:"#888"}}>{currentLogical.length} problems · Code quality over correctness</div>
          </div>
          <div style={{display:"flex",gap:"4px",flexWrap:"wrap",marginLeft:"auto"}}>
            {STUDY_PLAN.filter(d=>d.logical.length>0).map(d=>(
              <button key={d.day} onClick={()=>{setActiveDay(d.day);setActiveBatch(0);}} style={{padding:"4px 8px",borderRadius:"6px",border:`1px solid ${activeDay===d.day?"#FF6692":"#2a2d3a"}`,background:activeDay===d.day?"#FF669222":"transparent",color:activeDay===d.day?"#FF6692":"#666",fontSize:"0.72rem",fontWeight:700,cursor:"pointer"}}>D{d.day}</button>
            ))}
          </div>
        </div>

        <div style={{background:"#1a1d27",borderRadius:"10px",padding:"12px 14px",marginBottom:"14px",border:"1px solid #1e2235",fontSize:"0.8rem",color:"#aaa",lineHeight:1.6}}>
          <strong style={{color:"#FF6692"}}>🎯 Amazon grades: </strong>Meaningful names · Short functions · Guard clauses · No duplication · Complexity comment · Reads on first pass
        </div>

        {currentLogical.length === 0 && (
          <div style={{textAlign:"center",padding:"40px",color:"#555"}}>No L&M problems for Day {activeDay}. Select a day with L&M problems (D1–D4).</div>
        )}

        {currentLogical.map(p => {
          const status = answered[p.id];
          const hinted = expandedHints[p.id];
          return (
            <div key={p.id} style={S.card(status)}>
              <div style={{display:"flex",alignItems:"center",gap:"6px",marginBottom:"10px",flexWrap:"wrap"}}>
                <span style={S.badge("#252836","#666")}>{p.id}</span>
                <span style={S.badge("#FF669222","#FF6692")}>🧹 L&M</span>
                <span style={S.badge(DIFF_BG[p.difficulty],DIFF_COLOR[p.difficulty])}>{p.difficulty}</span>
                <span style={S.badge("#AB63FA22","#AB63FA")}>{p.focus}</span>
                <span style={{fontSize:"0.68rem",color:"#555",marginLeft:"auto"}}>{p.source}</span>
                {status && <span>{status==="solved"?"✅":status==="unsolved"?"❌":"⏭️"}</span>}
              </div>
              <div style={{fontSize:"0.97rem",fontWeight:700,color:"#fff",marginBottom:"10px"}}>{p.title}</div>
              <div style={{fontSize:"0.78rem",color:"#888",marginBottom:"10px"}}>📋 Open logical_quiz.html for the full problem statement, bad example, and Amazon signal.</div>
              <div style={{display:"flex",gap:"6px",flexWrap:"wrap"}}>
                <button style={{...S.btn("#00b8a3",status==="solved"?"#004a38":"#003d37","#00b8a3")}} onClick={()=>mark(p.id,"solved")}>✅ Solved</button>
                <button style={{...S.btn("#ff375f",status==="unsolved"?"#4a0010":"#3d0010","#ff375f")}} onClick={()=>mark(p.id,"unsolved")}>❌ Review</button>
                <button style={{...S.btn("#ffc01e",status==="skip"?"#4a3a00":"#3d3200","#ffc01e")}} onClick={()=>mark(p.id,"skip")}>⏭️ Skip</button>
                <button style={S.btn("#FF6692","#2a1020","#FF6692")} onClick={()=>toggleHint(p.id)}>{hinted?"🙈 Hide":"💡 Hint"}</button>
              </div>
              {hinted && (
                <div style={{marginTop:"10px",background:"#2a1020",borderRadius:"8px",padding:"10px 12px",borderLeft:"3px solid #FF6692",fontSize:"0.8rem",color:"#ccc",lineHeight:1.6}}>
                  <strong style={{color:"#FF6692"}}>💡 Key: </strong>
                  {{ L1:"Three separate helpers: is_case_insensitive_match, is_prefix_within_tolerance, differs_by_one_allowed_char. Main fn only calls these.",
                     L2:"Dispatcher dict HANDLERS={'ADD':handle_add,...}. Each handler is a separate function. No if/elif chain.",
                     L3:"One private method per step: _check_length, _check_character_format, _check_digit_sum, _check_letter_checksum, _check_parity. validate() loops through them.",
                     L4:"De-duplicate pool. RuleChecker class with list of (type,val). check(password) iterates cleanly.",
                     L5:"JOIN + GROUP BY region. SUM(CASE WHEN status='X' THEN weight ELSE 0 END). HAVING COUNT(*)>=5.",
                     L6:"_validate_user() guard at top of every public method. _prune_expired() as private helper. UserRateConfig + UserRateState dataclasses.",
                     L7:"One _check_X() method per rule, each returns List[str] of errors. validate() calls all 5 and collects. Return ALL errors not just first.",
                     L8:"MetricSeries owns data. StatsCalculator has static compute methods. MetricsAggregator delegates to both.",
                  }[p.id] || "Separate helpers, guard clauses, meaningful names, complexity comment."}
                </div>
              )}
            </div>
          );
        })}
      </div>
    );
  };

  // ── TOPBAR ────────────────────────────────────────────────────────────────
  const Topbar = () => (
    <div style={S.topbar}>
      <div style={{fontSize:"0.9rem",fontWeight:700,color:"#fff"}}>
        {view==="plan"?"📅 Study Plan":view==="dsa"?"🚀 DS&A Quiz":view==="classes"?"⚙️ Classes & Modularization":"🧹 Logical & Maintainable"}
      </div>
      <div style={{marginLeft:"auto",display:"flex",gap:"8px",alignItems:"center",flexWrap:"wrap"}}>
        {/* Overall mini progress */}
        <div style={{display:"flex",gap:"10px",alignItems:"center",fontSize:"0.75rem"}}>
          <span style={{color:"#636EFA",fontWeight:600}}>DS&A {dsaDone}/{dsaTotal}</span>
          <span style={{color:"#54A24B",fontWeight:600}}>⚙️ {classDone}/{classTotal}</span>
          <span style={{color:"#FF6692",fontWeight:600}}>🧹 {logicDone}/{logicTotal}</span>
        </div>
        <div style={{background:"#252836",borderRadius:"6px",height:"5px",width:"100px",overflow:"hidden"}}>
          <div style={{height:"100%",width:`${pct([grandDone,grandTotal])}%`,background:"linear-gradient(90deg,#636EFA,#EF553B)",borderRadius:"6px"}}/>
        </div>
        <span style={{fontSize:"0.75rem",color:"#888"}}>{grandDone}/{grandTotal}</span>
      </div>
    </div>
  );

  return (
    <div style={S.layout}>
      <Sidebar/>
      <div style={S.main}>
        <Topbar/>
        {view==="plan" && <PlanView/>}
        {view==="dsa" && <DSAView/>}
        {view==="classes" && <ClassesView/>}
        {view==="logical" && <LogicalView/>}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
