const QUIZ_SEQUENCE = [...ALL_QUESTIONS].sort((a,b) => a[0]-b[0]);
const TOTAL = QUIZ_SEQUENCE.length;
const PER_BATCH = 5;

function AmazonDSAQuiz() {
  const [answered, setAnswered] = useState({});
  const [batchIdx, setBatchIdx] = useState(0);
  const [showHint, setShowHint] = useState({});
  const [showProblem, setShowProblem] = useState({});
  const [view, setView] = useState("quiz");

  const currentBatch = QUIZ_SEQUENCE.slice(batchIdx*PER_BATCH, (batchIdx+1)*PER_BATCH);
  const totalBatches = Math.ceil(TOTAL/PER_BATCH);
  const mark = (rank, status) => setAnswered(prev=>({...prev,[rank]:status}));
  const toggleHint = rank => setShowHint(prev=>({...prev,[rank]:!prev[rank]}));
  const toggleProblem = rank => setShowProblem(prev=>({...prev,[rank]:!prev[rank]}));
  const allBatchAnswered = currentBatch.every(q=>answered[q[0]]);

  const solved   = Object.values(answered).filter(v=>v==="solved").length;
  const unsolved = Object.values(answered).filter(v=>v==="unsolved").length;
  const skipped  = Object.values(answered).filter(v=>v==="skip").length;
  const total_done = solved+unsolved+skipped;
  const pct = Math.round((total_done/TOTAL)*100);

  const catCounts = {};
  QUIZ_SEQUENCE.forEach(q=>{ catCounts[q[5]]=(catCounts[q[5]]||0)+1; });
  const catProgress = {};
  Object.keys(catCounts).forEach(cat=>{
    const qs = QUIZ_SEQUENCE.filter(q=>q[5]===cat);
    catProgress[cat]={total:qs.length,solved:qs.filter(q=>answered[q[0]]==="solved").length,unsolved:qs.filter(q=>answered[q[0]]==="unsolved").length,skip:qs.filter(q=>answered[q[0]]==="skip").length};
  });

  const qPerDay = Math.ceil(TOTAL/9);
  const currentDay = Math.min(9, Math.floor(total_done/qPerDay)+1);

  const S = {
    app:{minHeight:"100vh",background:"linear-gradient(135deg,#0f1117,#1a1d27)",color:"#e0e0e0",fontFamily:"'Segoe UI',Arial,sans-serif"},
    hdr:{background:"#1a1d27",borderBottom:"1px solid #2a2d3a",padding:"14px 24px",display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:"10px",position:"sticky",top:0,zIndex:100},
    navBtn:a=>({padding:"6px 14px",borderRadius:"20px",border:"none",cursor:"pointer",fontWeight:600,fontSize:"0.82rem",background:a?"#636EFA":"#252836",color:a?"#fff":"#aaa"}),
    pBar:{background:"#252836",borderRadius:"8px",height:"6px",width:"150px",overflow:"hidden"},
    pFill:{height:"100%",background:"linear-gradient(90deg,#636EFA,#EF553B)",borderRadius:"8px",width:`${pct}%`,transition:"width 0.4s"},
    main:{maxWidth:"860px",margin:"0 auto",padding:"20px 14px"},
    batchNav:{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:"16px",background:"#1a1d27",borderRadius:"12px",padding:"14px 18px"},
    card:s=>({background:s==="solved"?"#0f2a27":s==="unsolved"?"#2a0f13":s==="skip"?"#2a2008":"#1a1d27",borderRadius:"14px",padding:"18px",marginBottom:"12px",border:`1px solid ${s==="solved"?"#00b8a340":s==="unsolved"?"#ff375f40":s==="skip"?"#ffc01e40":"#2a2d3a"}`}),
    badge:(bg,c)=>({background:bg,color:c,padding:"2px 8px",borderRadius:"6px",fontSize:"0.72rem",fontWeight:600,display:"inline-block"}),
    btn:(border,bg,c)=>({padding:"7px 13px",borderRadius:"8px",border:`1px solid ${border}`,background:bg,color:c,cursor:"pointer",fontSize:"0.79rem",fontWeight:600}),
    hintBox:{marginTop:"12px",background:"#252836",borderRadius:"10px",padding:"12px 14px",borderLeft:"3px solid #636EFA",fontSize:"0.83rem",color:"#ccc",lineHeight:1.6},
    problemBox:{marginTop:"12px",background:"#1a2035",borderRadius:"10px",padding:"14px 16px",borderLeft:"3px solid #AB63FA",fontSize:"0.83rem",color:"#ccc",lineHeight:1.7},
  };

  if (view==="progress") return (
    <div style={S.app}>
      <div style={S.hdr}>
        <div style={{fontSize:"1.1rem",fontWeight:700,color:"#fff"}}>🚀 DS&A Quiz — Progress</div>
        <div style={{display:"flex",gap:"8px",alignItems:"center",flexWrap:"wrap"}}>
          <button style={S.navBtn(false)} onClick={()=>setView("quiz")}>📝 Quiz</button>
          <button style={S.navBtn(true)}>📊 Progress</button>
          <div><div style={S.pBar}><div style={S.pFill}/></div><div style={{fontSize:"0.68rem",color:"#777",textAlign:"center",marginTop:"2px"}}>{pct}%</div></div>
        </div>
      </div>
      <div style={S.main}>
        <div style={{background:"#1a1d27",borderRadius:"12px",padding:"16px",border:"1px solid #2a2d3a",marginBottom:"18px"}}>
          <div style={{fontSize:"0.83rem",color:"#aaa",marginBottom:"10px"}}>📅 9-Day Plan (4/19–4/27) — ~{qPerDay} DS&A questions/day</div>
          <div style={{display:"flex",gap:"8px",flexWrap:"wrap"}}>
            {[1,2,3,4,5,6,7,8,9].map(day=>{
              const dayQs=QUIZ_SEQUENCE.slice((day-1)*qPerDay,Math.min(day*qPerDay,TOTAL));
              const daySolved=dayQs.filter(q=>answered[q[0]]).length;
              const isDone=daySolved===dayQs.length;
              const isCur=day===currentDay;
              return <div key={day} style={{flex:"1 1 60px",background:isDone?"#0f2a27":isCur?"#252836":"#1e2030",border:`1px solid ${isDone?"#00b8a3":isCur?"#636EFA":"#2a2d3a"}`,borderRadius:"10px",padding:"8px",textAlign:"center"}}>
                <div style={{fontSize:"0.75rem",fontWeight:700,color:isDone?"#00b8a3":isCur?"#636EFA":"#aaa"}}>{isDone?"✅":isCur?"⚡":"📋"} D{day}</div>
                <div style={{fontSize:"1rem",fontWeight:800,color:"#fff",marginTop:"4px"}}>{daySolved}/{dayQs.length}</div>
              </div>;
            })}
          </div>
        </div>
        <div style={{display:"flex",gap:"10px",flexWrap:"wrap",marginBottom:"18px"}}>
          {[["#00b8a3",solved,"✅ Solved"],["#ff375f",unsolved,"❌ Review"],["#ffc01e",skipped,"⏭️ Skipped"],["#636EFA",TOTAL-total_done,"⏳ Left"]].map(([c,n,l])=>(
            <div key={l} style={{flex:"1 1 110px",background:"#1a1d27",borderRadius:"12px",padding:"14px",border:`1px solid ${c}33`,textAlign:"center"}}>
              <div style={{fontSize:"1.7rem",fontWeight:800,color:c}}>{n}</div>
              <div style={{fontSize:"0.74rem",color:"#777",marginTop:"4px"}}>{l}</div>
            </div>
          ))}
        </div>
        <div style={{fontSize:"0.95rem",fontWeight:700,color:"#fff",marginBottom:"10px"}}>Category Progress</div>
        {Object.entries(catProgress).sort((a,b)=>b[1].total-a[1].total).map(([cat,cp])=>{
          const meta=CAT_META[cat]||{color:"#888",emoji:"📌"};
          const donePct=cp.total>0?Math.round(((cp.solved+cp.unsolved+cp.skip)/cp.total)*100):0;
          return <div key={cat} style={{background:"#1a1d27",borderRadius:"10px",padding:"12px 16px",marginBottom:"8px",border:"1px solid #2a2d3a"}}>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:"8px"}}>
              <span style={{fontWeight:600,fontSize:"0.87rem"}}>{meta.emoji} {cat}</span>
              <div style={{display:"flex",gap:"8px",fontSize:"0.74rem"}}>
                <span style={{color:"#00b8a3"}}>{cp.solved}✓</span>
                <span style={{color:"#ff375f"}}>{cp.unsolved}✗</span>
                <span style={{color:"#ffc01e"}}>{cp.skip}⏭</span>
                <span style={{color:"#555"}}>/{cp.total}</span>
              </div>
            </div>
            <div style={{background:"#252836",borderRadius:"4px",height:"6px",overflow:"hidden"}}>
              <div style={{height:"100%",width:`${donePct}%`,background:`linear-gradient(90deg,${meta.color},${meta.color}88)`,borderRadius:"4px",transition:"width 0.4s"}}/>
            </div>
          </div>;
        })}
      </div>
    </div>
  );

  return (
    <div style={S.app}>
      <div style={S.hdr}>
        <div style={{fontSize:"1.1rem",fontWeight:700,color:"#fff",display:"flex",alignItems:"center",gap:"8px"}}>
          🚀 DS&amp;A Quiz <span style={{fontSize:"0.76rem",color:"#888",fontWeight:400}}>{TOTAL} questions · {TOTAL-ALL_QUESTIONS.filter(q=>!q[6]).length} Amazon OA</span>
        </div>
        <div style={{display:"flex",gap:"8px",alignItems:"center",flexWrap:"wrap"}}>
          <button style={S.navBtn(true)}>📝 Quiz</button>
          <button style={S.navBtn(false)} onClick={()=>setView("progress")}>📊 Progress</button>
          <div><div style={S.pBar}><div style={S.pFill}/></div><div style={{fontSize:"0.68rem",color:"#777",textAlign:"center",marginTop:"2px"}}>{total_done}/{TOTAL} ({pct}%)</div></div>
        </div>
      </div>
      <div style={S.main}>
        <div style={S.batchNav}>
          <div>
            <div style={{fontWeight:700,fontSize:"1rem",color:"#fff"}}>Batch {batchIdx+1} / {totalBatches}</div>
            <div style={{fontSize:"0.83rem",color:"#aaa"}}>Questions {batchIdx*PER_BATCH+1}–{Math.min((batchIdx+1)*PER_BATCH,TOTAL)}</div>
          </div>
          <div style={{display:"flex",gap:"8px"}}>
            <button style={{...S.btn("#636EFA","#1e2030","#636EFA"),opacity:batchIdx===0?0.3:1}} onClick={()=>batchIdx>0&&setBatchIdx(b=>b-1)}>← Prev</button>
            <button style={{...S.btn("#00b8a3","#003d37","#00b8a3"),opacity:batchIdx>=totalBatches-1?0.3:1}} onClick={()=>batchIdx<totalBatches-1&&setBatchIdx(b=>b+1)}>Next →</button>
          </div>
        </div>

        <div style={{background:"#1a1d2799",borderRadius:"10px",padding:"9px 14px",marginBottom:"14px",fontSize:"0.77rem",color:"#888",display:"flex",flexWrap:"wrap",gap:"6px",alignItems:"center"}}>
          <span>🎯</span>
          {[...new Set(currentBatch.map(q=>q[5]))].map(cat=>(
            <span key={cat} style={S.badge((CAT_META[cat]?.color||"#888")+"22",CAT_META[cat]?.color||"#888")}>{CAT_META[cat]?.emoji} {cat}</span>
          ))}
        </div>

        {currentBatch.map((q,idx)=>{
          const [rank,lcNum,title,acceptance,difficulty,category,isOA]=q;
          const status=answered[rank];
          const hinted=showHint[rank];
          const problemShown=showProblem[rank];
          const slug=title.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
          const lcUrl=`https://leetcode.com/problems/${slug}/`;
          const oaData=OA_PROBLEMS[title];
          return (
            <div key={rank} style={S.card(status)}>
              <div style={{display:"flex",alignItems:"center",gap:"8px",marginBottom:"10px",flexWrap:"wrap"}}>
                <span style={S.badge("#252836","#888")}>#{rank}</span>
                {isOA ? <span style={S.badge("#FF97FF22","#FF97FF")}>🏢 Amazon OA</span>
                      : <span style={S.badge("#636EFA22","#636EFA")}>LC {lcNum}</span>}
                <span style={S.badge(DIFF_BG[difficulty],DIFF_COLOR[difficulty])}>{difficulty}</span>
                <span style={S.badge((CAT_META[category]?.color||"#888")+"22",CAT_META[category]?.color||"#888")}>{CAT_META[category]?.emoji} {category}</span>
                {status&&<span style={{marginLeft:"auto",fontSize:"1.1rem"}}>{status==="solved"?"✅":status==="unsolved"?"❌":"⏭️"}</span>}
              </div>
              <div style={{fontSize:"1rem",fontWeight:700,color:"#fff",marginBottom:"10px",lineHeight:1.4}}>{idx+1}. {title}</div>
              <div style={{fontSize:"0.75rem",color:"#777",marginBottom:"12px"}}>Acceptance: {acceptance}</div>
              <div style={{display:"flex",gap:"8px",flexWrap:"wrap",alignItems:"center"}}>
                <button style={{...S.btn("#00b8a3",status==="solved"?"#005f4a":"#003d37","#00b8a3")}} onClick={()=>mark(rank,"solved")}>✅ Solved</button>
                <button style={{...S.btn("#ff375f",status==="unsolved"?"#5f0015":"#3d0010","#ff375f")}} onClick={()=>mark(rank,"unsolved")}>❌ Review</button>
                <button style={{...S.btn("#ffc01e",status==="skip"?"#5f4f00":"#3d3200","#ffc01e")}} onClick={()=>mark(rank,"skip")}>⏭️ Skip</button>
                <button style={S.btn("#636EFA","#1e2030","#636EFA")} onClick={()=>toggleHint(rank)}>{hinted?"🙈 Hide Hint":"💡 Hint"}</button>
                {isOA
                  ? <button style={S.btn("#AB63FA","#1e2030","#AB63FA")} onClick={()=>toggleProblem(rank)}>{problemShown?"📕 Hide":"📖 Problem"}</button>
                  : <a href={lcUrl} target="_blank" rel="noreferrer" style={{...S.btn("#FFA15A","#1e2030","#FFA15A"),textDecoration:"none"}}>🔗 LC</a>
                }
              </div>
              {problemShown&&oaData&&<div style={S.problemBox}>
                <div style={{fontWeight:700,color:"#AB63FA",marginBottom:"8px"}}>📖 Problem Statement</div>
                <div style={{marginBottom:"10px"}}>{oaData.desc}</div>
                <div style={{fontWeight:600,color:"#888",fontSize:"0.78rem",marginBottom:"4px"}}>EXAMPLE</div>
                <pre style={{background:"#0f1117",padding:"10px",borderRadius:"8px",fontSize:"0.78rem",overflowX:"auto",whiteSpace:"pre-wrap"}}>{oaData.example}</pre>
                <div style={{marginTop:"8px",fontSize:"0.78rem",color:"#888"}}><strong style={{color:"#AB63FA"}}>Pattern:</strong> {oaData.pattern}</div>
              </div>}
              {hinted&&<div style={S.hintBox}><strong style={{color:"#636EFA"}}>💡 </strong>{isOA&&oaData?oaData.hint:(HINTS[lcNum]||"Check the LeetCode editorial.")}</div>}
            </div>
          );
        })}

        {allBatchAnswered&&batchIdx<totalBatches-1&&(
          <div style={{background:"#0f2a27",border:"1px solid #00b8a3",borderRadius:"12px",padding:"16px",textAlign:"center",marginTop:"8px"}}>
            <div style={{fontSize:"1rem",fontWeight:700,color:"#00b8a3",marginBottom:"6px"}}>🎉 Batch {batchIdx+1} done!</div>
            <div style={{fontSize:"0.83rem",color:"#aaa",marginBottom:"12px"}}>{total_done}/{TOTAL} total complete</div>
            <button style={{...S.btn("#00b8a3","#005f4a","#00b8a3"),padding:"9px 26px"}} onClick={()=>{setBatchIdx(b=>b+1);window.scrollTo(0,0);}}>Next Batch →</button>
          </div>
        )}
        {total_done===TOTAL&&(
          <div style={{background:"linear-gradient(135deg,#0f2a27,#1a2d45)",border:"1px solid #636EFA",borderRadius:"14px",padding:"24px",textAlign:"center",marginTop:"16px"}}>
            <div style={{fontSize:"2rem",marginBottom:"8px"}}>🏆</div>
            <div style={{fontSize:"1.2rem",fontWeight:800,color:"#fff",marginBottom:"6px"}}>All {TOTAL} DS&A questions reviewed!</div>
            <div style={{fontSize:"0.88rem",color:"#aaa"}}>{solved} solved · {unsolved} review · {skipped} skipped</div>
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<AmazonDSAQuiz/>);
</script>
</body>
</html>
